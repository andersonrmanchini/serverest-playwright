name: Playwright Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    env:
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      WEB_BASE_URL: ${{ secrets.WEB_BASE_URL }}
    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright browsers
      run: npx playwright install --with-deps

    - name: Run Playwright tests
      run: npm test

    - name: Upload test report
      uses: actions/upload-artifact@v4
      if: always() # Upload report even if tests fail
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    - name: Report CI Status to GitHub
      if: always()
      run: |
        STATUS="${{ job.status }}"
        STATE=$([ "$STATUS" = "success" ] && echo "success" || echo "failure")
        DESCRIPTION=$([ "$STATUS" = "success" ] && echo "All checks passed" || echo "Some checks failed")
        
        curl -X POST \
          -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github.v3+json" \
          https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }} \
          -d "{\"state\":\"$STATE\",\"context\":\"ci.yml\",\"description\":\"$DESCRIPTION\"}"
